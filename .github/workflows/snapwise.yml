# Snapwise reviewing its own example contract: every PR that changes
# examples/vault/test_snapshots gets a sticky comment.
name: Snapwise

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          working-directory: examples
