name: Bug report
description: Something Snapwise does is wrong or crashes.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or workflow step you ran, and the output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      description: Ideally attach the two snapshot files (base and head) or link a public repo. Remove anything sensitive.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Snapwise version
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: soroban-sdk version that wrote the snapshots
      placeholder: "29.0.1"
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options:
        - GitHub Action
        - CLI
        - Library
